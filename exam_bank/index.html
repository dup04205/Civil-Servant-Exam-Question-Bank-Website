<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공무원 기출문제</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <!-- 상단 고정 헤더 & 4단계 흐름 내비게이션 -->
  <header class="site-header">
    <div class="header-inner">
      <a href="#" class="site-title" id="btnHome">공무원 기출문제</a>

      <nav class="step-nav" aria-label="학습 단계">
        <button type="button" class="step-btn is-active" data-step="select">
          <span class="step-num tabular-nums">1</span>
          <span>직렬 선택</span>
        </button>
        <span class="step-sep" aria-hidden="true">/</span>
        <button type="button" class="step-btn" data-step="solve">
          <span class="step-num tabular-nums">2</span>
          <span>문제</span>
        </button>
        <span class="step-sep" aria-hidden="true">/</span>
        <button type="button" class="step-btn" data-step="review">
          <span class="step-num tabular-nums">3</span>
          <span>해설</span>
        </button>
        <span class="step-sep" aria-hidden="true">/</span>
        <button type="button" class="step-btn" data-step="wrong">
          <span class="step-num tabular-nums">4</span>
          <span>오답</span>
          <span class="step-count tabular-nums" id="navWrongCount">0</span>
        </button>
      </nav>

      <div class="header-meta tabular-nums" id="headerContext">직렬을 선택해 시작하세요</div>
    </div>
  </header>

  <main class="page-container">
    <!-- ==================== 1단계: 직렬 선택 ==================== -->
    <section class="step-section is-active" id="stepSelect" aria-label="1단계 직렬 선택">
      <div class="section-intro">
        <h1>응시할 직렬을 선택하세요</h1>
        <p>시험 구분과 직렬을 고른 뒤 연도·과목별 기출문제를 바로 풀 수 있습니다.</p>
      </div>

      <!-- 시험 구분 · 직급 세그먼트 -->
      <div class="segment-bar" id="examGradeSegments" role="tablist" aria-label="시험 구분 및 직급">
        <button type="button" class="segment-btn is-active" data-exam="국가직" data-grade="9급">국가직 9급</button>
        <button type="button" class="segment-btn" data-exam="지방직" data-grade="9급">지방직 9급</button>
        <button type="button" class="segment-btn" data-exam="국가직" data-grade="7급">국가직 7급</button>
        <button type="button" class="segment-btn" data-exam="지방직" data-grade="7급">지방직 7급</button>
      </div>

      <!-- 직렬 목록 -->
      <div class="block-section">
        <div class="block-head">
          <h2>직렬</h2>
          <span class="block-sub tabular-nums" id="seriesCountLabel">0개 직렬</span>
        </div>
        <div class="series-grid" id="seriesGrid"></div>
      </div>

      <!-- 선택된 직렬의 과목 · 연도 선택 영역 -->
      <div class="block-section" id="paperPickerBlock" hidden>
        <div class="block-head">
          <h2 id="selectedSeriesTitle">과목 및 연도 선택</h2>
          <div class="inline-filters">
            <select id="pickerYear" aria-label="연도 선택">
              <option value="">전체 연도</option>
            </select>
            <select id="pickerSubject" aria-label="과목 선택">
              <option value="">전체 과목</option>
            </select>
          </div>
        </div>
        <div class="paper-list" id="paperList"></div>
      </div>
    </section>

    <!-- ==================== 2단계: 문제 풀기 ==================== -->
    <section class="step-section" id="stepSolve" aria-label="2단계 문제 풀기">
      <div class="sticky-subbar">
        <div class="subbar-left">
          <button type="button" class="btn-ghost" id="btnBackToSelect">← 직렬 다시 선택</button>
          <div class="subbar-title">
            <strong id="solveTitle">시험지</strong>
            <span class="tabular-nums" id="solveMeta"></span>
          </div>
        </div>
        <div class="subbar-right">
          <span class="timer-pill tabular-nums" id="solveTimer">00:00</span>
          <span class="progress-pill tabular-nums" id="solveProgress">0 / 20</span>
          <button type="button" class="btn-solid" id="btnGoReview">채점하고 해설 보기 →</button>
        </div>
      </div>

      <div class="solve-grid">
        <div class="question-list" id="solveQuestionList"></div>

        <aside class="omr-rail" aria-label="문항 번호 바로가기">
          <div class="omr-title">문항 이동</div>
          <div class="omr-nums" id="solveOmrNums"></div>
        </aside>
      </div>

      <div class="bottom-cta-bar">
        <button type="button" class="btn-ghost" id="btnResetPaperAnswers">선택 초기화</button>
        <button type="button" class="btn-solid" id="btnGoReviewBottom">채점하고 해설 보기 →</button>
      </div>
    </section>

    <!-- ==================== 3단계: 해설 보기 ==================== -->
    <section class="step-section" id="stepReview" aria-label="3단계 해설 보기">
      <div class="summary-strip" id="reviewSummaryStrip">
        <div class="summary-main">
          <div class="summary-label" id="reviewPaperName">채점 결과</div>
          <div class="summary-score tabular-nums" id="reviewScoreText">-</div>
        </div>
        <div class="summary-actions">
          <div class="filter-pills" role="group" aria-label="해설 필터">
            <button type="button" class="pill-btn is-active" data-review-filter="all">전체 문항</button>
            <button type="button" class="pill-btn" data-review-filter="wrong">틀린 문항만</button>
            <button type="button" class="pill-btn" data-review-filter="correct">맞힌 문항만</button>
          </div>
          <button type="button" class="btn-solid" id="btnGoWrongFromReview">오답노트로 이동 →</button>
        </div>
      </div>

      <div class="question-list" id="reviewQuestionList"></div>

      <div class="bottom-cta-bar">
        <button type="button" class="btn-ghost" id="btnBackToSolve">← 문제 다시 보기</button>
        <button type="button" class="btn-solid" id="btnGoWrongBottom">오답노트로 이동 →</button>
      </div>
    </section>

    <!-- ==================== 4단계: 오답노트 ==================== -->
    <section class="step-section" id="stepWrong" aria-label="4단계 오답노트">
      <div class="section-intro-row">
        <div class="section-intro">
          <h1>오답노트</h1>
          <p>틀린 문항을 모아서 다시 풀고, 해설과 메모를 복습할 수 있습니다.</p>
        </div>
        <div class="wrong-controls">
          <form class="inline-search" id="wrongSearchForm">
            <input type="search" id="wrongSearchInput" placeholder="오답 내 키워드 검색" aria-label="오답 검색">
            <button type="submit" class="btn-outline">검색</button>
          </form>
        </div>
      </div>

      <div class="wrong-tabs">
        <button type="button" class="pill-btn is-active" data-wrong-mode="wrong">틀린 문항</button>
        <button type="button" class="pill-btn" data-wrong-mode="bookmarked">북마크 문항</button>
        <button type="button" class="pill-btn" data-wrong-mode="all">전체 문항 검색</button>
        <span class="wrong-total tabular-nums" id="wrongTotalCount">0문항</span>
      </div>

      <div class="question-list" id="wrongQuestionList"></div>

      <div class="pagination" id="wrongPagination">
        <button type="button" class="btn-outline" id="btnWrongPrev">이전</button>
        <span class="tabular-nums" id="wrongPageLabel">1 / 1</span>
        <button type="button" class="btn-outline" id="btnWrongNext">다음</button>
      </div>
    </section>
  </main>

  <!-- 채점 완료 안내 다이얼로그 -->
  <dialog id="scoreDialog" closedby="any" aria-labelledby="scoreDialogTitle">
    <div class="dialog-box">
      <div class="dialog-head">
        <h2 id="scoreDialogTitle">채점 완료</h2>
        <button type="button" class="btn-close" id="btnCloseScoreDialog" aria-label="닫기">×</button>
      </div>
      <div class="dialog-body" id="scoreDialogBody"></div>
      <div class="dialog-foot">
        <button type="button" class="btn-solid" id="btnConfirmScoreDialog">해설 확인하기</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
